<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PLC-Ki login</title>
  <link rel="stylesheet" href="ui.css">
  <script>try { var t = localStorage.getItem("plcki.paint") || localStorage.getItem("plcki.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* private window */ }</script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card stack">
      <div style="text-align:center;margin-bottom:8px">
        <span class="eyebrow" style="justify-content:center">PLC-Ki</span>
        <h1 style="font-size:40px;margin:6px 0 4px">What is the machine doing?</h1>
        <p class="muted" style="margin:0">Plain English from the PLC.</p>
      </div>
      <form id="form" class="card stack" autocomplete="on">
        <h3 id="title" style="margin:0">Log in</h3>
        <p id="intro" class="muted small hidden" style="margin:0"></p>
        <label class="field">User name<input id="name" type="text" autocomplete="username" required autofocus></label>
        <label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label>
        <label id="repeat-field" class="field hidden">Password again<input id="repeat" type="password" autocomplete="new-password"><span class="hint">At least 8 characters.</span></label>
        <p id="error" class="notice red hidden" role="alert" style="margin:0"></p>
        <button id="submit" class="btn big" type="submit">Log in</button>
      </form>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
